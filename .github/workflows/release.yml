name: release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish LubricentroVelezV2.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - run: |
          Remove-Item publish/*.config
          Compress-Archive -Path publish/* -DestinationPath LubricentroVelez-win-x64.zip
      - run: gh release create "build-${{ github.run_number }}" LubricentroVelez-win-x64.zip --title "Build ${{ github.run_number }}" --notes "win-x64" --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
